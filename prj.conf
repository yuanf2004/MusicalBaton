# GPIO and PWM-controlled status LED
CONFIG_GPIO=y
CONFIG_PWM=y

# Allow the long button hold to reboot the system
CONFIG_REBOOT=y

# I2C for MMA8451
CONFIG_I2C=y

# Serial console output
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Bluetooth Low Energy
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Smart Baton"
CONFIG_BT_MAX_CONN=1
