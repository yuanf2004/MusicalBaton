# GPIO and PWM-controlled status LED
CONFIG_GPIO=y
CONFIG_PWM=y

# Allow the long button hold to reboot the system
CONFIG_REBOOT=y

# I2C and Zephyr sensor driver for LSM6DSOX six-axis polling
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSO=y
CONFIG_LSM6DSO_TRIGGER_NONE=y

# Serial console output
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
# Send printk directly to UART instead of batching it in the deferred logger.
CONFIG_LOG_PRINTK=n

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Bluetooth Low Energy
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Smart Baton"
CONFIG_BT_MAX_CONN=1

# Ask for 15 ms connection events, no skipped events, and 4 s supervision.
# Zephyr requests these after the standard 5 s post-connect delay; iOS decides.
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
