# PCB diagnostics travel through J-Link/SWD; no DK UART pins are connected.
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
# RTT logging shares channel zero; route printk through the drop-mode backend.
CONFIG_LOG_PRINTK=y
CONFIG_RTT_TX_RETRY_CNT=0

# The schematic specifies a populated external 32.768 kHz crystal.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_50PPM=y

# Standalone application programmed through SWD, not an MCUboot slot image.
CONFIG_BOOTLOADER_MCUBOOT=n

CONFIG_ADC=y
